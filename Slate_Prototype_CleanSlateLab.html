/* Slate — design system. Two surfaces: paper for the person, graphite for Slate's mind. One accent: first light. */
:root{
  --paper:#F2F1EC; --paper-2:#E9E8E2; --paper-3:#FAF9F6; --ink:#16181B; --ink-2:#3A3D42; --muted:#6B6F76; --muted-2:#9A9EA5; --line:#D6D3CB; --line-2:#E4E1DA;
  --slate:#22272D; --slate-2:#2B3138; --slate-3:#343B43; --slate-line:#3D454E; --chalk:#E9E7E1; --chalk-dim:#A3A8AF; --chalk-dim2:#7C828A;
  --light:#C98A1E; --light-soft:rgba(201,138,30,.2); --ok:#2F7D4F; --warn:#B8442E; --sim:#7A7060; --white:#FFFFFF; --code:#1B1F24;
  --serif:"Tiro","Tiro Devanagari Hindi",Georgia,"Noto Serif Devanagari",serif;
  --sans:"Mukta",system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;
  --mono:"JB",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-s:9px; --shadow:0 18px 40px -22px rgba(22,24,27,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#1B1E21; --paper-2:#141618; --paper-3:#22262A; --ink:#E9E7E1; --ink-2:#CFCCC4; --muted:#9A9EA5; --muted-2:#6F747B; --line:#343940; --line-2:#2B3035;
  --slate:#0F1113; --slate-2:#181B1F; --slate-3:#20242A; --slate-line:#2A2F35; --chalk:#E9E7E1; --chalk-dim:#A3A8AF; --chalk-dim2:#7C828A;
  --light:#E0A63A; --light-soft:rgba(224,166,58,.22); --ok:#6CC08B; --warn:#E07A66; --sim:#B3A891; --white:#E9E7E1; --code:#0B0D0F; --shadow:0 18px 40px -22px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#1B1E21; --paper-2:#141618; --paper-3:#22262A; --ink:#E9E7E1; --ink-2:#CFCCC4; --muted:#9A9EA5; --muted-2:#6F747B; --line:#343940; --line-2:#2B3035;
  --slate:#0F1113; --slate-2:#181B1F; --slate-3:#20242A; --slate-line:#2A2F35; --chalk:#E9E7E1; --chalk-dim:#A3A8AF; --chalk-dim2:#7C828A;
  --light:#E0A63A; --light-soft:rgba(224,166,58,.22); --ok:#6CC08B; --warn:#E07A66; --sim:#B3A891; --white:#E9E7E1; --code:#0B0D0F; --shadow:0 18px 40px -22px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper-2);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
[lang="hi"],.hi{font-family:var(--sans);line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--light);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:52px 1fr auto}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper-3);font-size:13.5px}
.who b{font-weight:600}
.who .tag{color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.nav button{padding:6px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.nav button:hover{background:var(--paper-2)}
.nav button.on{background:var(--ink);color:var(--paper-3)}
.nav button.watch{border:1px solid var(--ink);margin-right:6px}
.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper-3)}
.tog input{accent-color:var(--ink)}

.stage{display:grid;grid-template-columns:1fr 0;transition:grid-template-columns .35s cubic-bezier(.2,.7,.2,1);min-height:0;position:relative}
.stage.mind{grid-template-columns:1fr 500px}
.personpane{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 20px 8px;min-height:0;overflow:hidden;position:relative}
.mindpane{background:var(--slate);color:var(--chalk);overflow:hidden;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--slate-line)}
.stage:not(.mind) .mindpane{visibility:hidden}

/* ---------- phone ---------- */
.phonewrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;gap:8px;width:100%;max-width:420px;height:100%;min-height:0}
.viewtabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.viewtabs button{padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.viewtabs button.on{background:var(--ink);color:var(--paper-3)}
.phone{width:100%;max-width:392px;background:var(--paper-3);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;height:100%;overflow:auto;position:relative;scrollbar-width:thin}
.phone .status{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:0 4px}
.phone .status b{font-weight:600;color:var(--ink-2)}
.phone .badge{position:absolute;top:14px;right:50%;transform:translateX(50%);font:500 10px var(--mono);letter-spacing:.06em;color:var(--sim);border:1px dashed var(--line);border-radius:999px;padding:2px 8px;background:var(--paper)}
.phone .badge.real{border-style:solid;color:var(--ok);border-color:var(--ok)}
.screenhead{font-family:var(--serif);font-size:18px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.screenhead small{font-family:var(--sans);font-size:12px;color:var(--muted-2)}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:9px 13px;border-radius:16px;background:var(--paper-2);font-size:15px;line-height:1.55;position:relative}
.bub.person{align-self:flex-end;background:var(--ink);color:var(--paper-3);border-bottom-right-radius:5px}
.bub:not(.person){border-bottom-left-radius:5px}
.bub.task{background:transparent;padding:4px 0;font-family:var(--serif);font-size:25px;line-height:1.35;color:var(--ink);max-width:100%}

.fbar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font:11.5px var(--mono);color:var(--chalk-dim)}

/* ---------- timeline ---------- */

.transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper-3);border-radius:9px;padding:6px 11px;font:500 13px var(--sans);white-space:nowrap}

.btn.primary{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}

.speed{display:flex;gap:1px;border:1px solid var(--line);border-radius:9px;overflow:hidden}

.wk{height:26px;border-radius:4px;background:var(--ink);opacity:.9;position:relative;cursor:pointer}

.led .live{font-size:13px;color:var(--ink-2)}
.wipe{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--paper-2) 30%,var(--paper-2) 70%,transparent);transform:translateX(-110%);animation:wipe 1.8s ease-in-out .3s both;pointer-events:none}

.fadeout{animation:fade .8s ease 1.5s both}
@keyframes fade{to{opacity:0}}
.rec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rec div{font-size:11px;color:var(--muted);line-height:1.2}
.rec b{display:block;font:500 20px var(--serif);color:var(--ink)}
.goalrow{display:flex;gap:6px;flex-wrap:wrap}
.gpill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--paper-3);display:flex;gap:6px;align-items:center}
.gpill .res{letter-spacing:2px;color:var(--ink)}
.gpill .res.spent{color:var(--muted-2)}
.gpill.dead{opacity:.5;text-decoration:line-through}

/* ---------- moment toast ---------- */
.toast{background:var(--ink);color:var(--paper-3);border-radius:14px;padding:10px 14px;width:100%;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;animation:rise .25s ease-out}
.toast b{font-family:var(--serif);font-weight:400;font-size:16px;display:block}
.toast span{font-size:12.5px;opacity:.85;display:block;line-height:1.35}
.toast button{border:1px solid currentColor;opacity:.9;border-radius:999px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:var(--paper-2);z-index:8;overflow:auto;padding:22px 28px 40px;animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovhead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.ovhead h1{font:400 28px var(--serif)}
.ovhead p{color:var(--muted);font-size:14px;max-width:760px}
.ovhead .x{margin-left:auto;font-size:26px;color:var(--muted);line-height:1;padding:0 6px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card h3{font:400 20px var(--serif)}
.card h3 small{font:400 13px var(--sans);color:var(--muted);margin-left:6px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.card .k{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.card.dashed{border-style:dashed;background:transparent}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.field input[type=range]{accent-color:var(--ink)}
.field select,.field input[type=text],.field input[type=time],.field input[type=number],textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper-3);color:var(--ink)}
.field .v{font-weight:600;color:var(--ink);font-family:var(--mono);font-size:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.switch:last-child{border-bottom:0}
.switch input{width:36px;height:20px;accent-color:var(--ink)}
.notches{letter-spacing:3px;font-family:var(--mono);color:var(--ink)}
.notches.low{color:var(--warn)}
.tree{font-size:14px;line-height:1.6}
.tree ul{list-style:none;padding-left:18px;border-left:1px dashed var(--line);margin-left:6px}
.tree li{padding:2px 0}
.tree .leaf{color:var(--muted)}
.tree .lvl{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.raillist{display:flex;flex-direction:column;gap:6px}
.rl{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.rl .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rl .top .n{font-family:var(--mono);font-weight:500}
.rl .top .p{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rl .top .t{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rl pre{display:none;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--paper-2);border-radius:8px;padding:8px 10px}

.rl.fail{border-color:#E4B9A8}
.pill{font:500 10.5px var(--mono);border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--sim)}
.pill.sim{border-style:dashed}
.pill.real{border-color:var(--ok);color:var(--ok)}
.pill.fail{color:var(--warn);border-color:#E4B9A8}

.gap{border-left:3px solid var(--light);padding:6px 10px;background:var(--paper);font-size:13px;border-radius:0 8px 8px 0}
.gap b{font-family:var(--mono);font-size:12px;font-weight:500}
.quote{font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--ink)}
.quote small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:6px}
.ubtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper);width:100%}

.ubtn.on{border-color:var(--light);background:var(--light-soft)}
.ubtn b{font-weight:600;font-size:14px}
.ubtn span{font-size:12.5px;color:var(--muted);line-height:1.4}
.evlines{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.evlines div{padding:7px 10px;background:var(--paper);border-left:3px solid var(--ink);border-radius:0 8px 8px 0;line-height:1.45}
.evlines div .t{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.evlines div.blocked{border-left-color:var(--light)}
.chipsl{display:flex;gap:6px;flex-wrap:wrap}
.chipsl button{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--paper)}
.chipsl button:hover{border-color:var(--ink)}
.tourbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--paper-3);border-radius:16px;padding:12px 16px;max-width:680px;width:calc(100% - 40px);box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;animation:rise .25s ease-out}
.tourbar .n{font:500 11px var(--mono);opacity:.7;letter-spacing:.06em}
.tourbar b{font:400 18px var(--serif);display:block}
.tourbar p{font-size:13.5px;line-height:1.45;opacity:.9}
.tourbar .btns{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.tourbar button{border:1px solid currentColor;border-radius:999px;padding:6px 12px;font-size:13px;opacity:.95}
.tourbar button.primary{background:var(--paper-3);color:var(--ink);border-color:var(--paper-3)}
.seam{position:absolute;inset:0;z-index:9;background:rgba(15,17,19,.94);color:#E9E7E1;display:flex;align-items:center;justify-content:center;padding:40px;animation:fadein .3s}
.seam div{max-width:620px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.seam h2{font:400 34px/1.25 var(--serif)}
.seam p{font-size:16px;line-height:1.55;opacity:.9}
.seam .pill{border-color:rgba(255,255,255,.5);color:#fff;font-size:12px}
.laws{display:flex;gap:6px;flex-wrap:wrap}
.law{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--paper)}
.law b{color:var(--ok);margin-right:4px}
.harness{font-family:var(--mono);font-size:12.5px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;max-height:260px;overflow:auto}
.audio{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper-3);font-size:13px;display:flex;flex-direction:column;gap:6px}
.audio audio{width:100%}
@media (max-width:1100px){
  .stage.mind{grid-template-columns:1fr 400px}
  .timeline{grid-template-columns:1fr}
  .phone{min-height:480px}
}

  #app{grid-template-rows:auto 1fr auto}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px}
  .stage.mind{grid-template-columns:1fr}
  .stage.mind .personpane{display:none}
  .mindpane{border-left:0}
  .phone{max-height:none;min-height:420px}
  .overlay{padding:16px}
}

  S.Voice.P = function (st, key, v) {
    v = v || {};
    var t = P[key]; if (!t) return { hi: '[' + key + ']', en: '[' + key + ']', same: true };
    var lang = st.persona.lang;
    var en = t.en(v);
    if (lang === 'en') return { hi: en, en: en, same: true, key: key };
    var hi = (lang === 'hi' && t.hi) ? t.hi(v) : t.hien(v);
    if (st.persona.register === 'aap') hi = S.Voice.toAap(hi);
    return { hi: hi, en: en, same: false, key: key };
  };
